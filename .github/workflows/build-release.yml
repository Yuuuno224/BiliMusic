name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install SDK platform android-36.1
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APKs
        run: |
          for f in app/build/outputs/apk/debug/*.apk; do
            base=$(basename "$f" .apk)
            cp "$f" "BiliMusic-${{ github.ref_name }}-${base#app-}.apk"
          done

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          echo "Extracted notes for $VERSION:"
          cat release_notes.md

      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete ${{ github.ref_name }} --yes || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BiliMusic-${{ github.ref_name }}-*.apk
          body_path: release_notes.md
