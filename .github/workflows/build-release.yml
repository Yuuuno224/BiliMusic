name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install SDK platform android-36.1
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BiliMusic-${{ github.ref_name }}.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BiliMusic-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            ## BiliMusic ${{ github.ref_name }}

            B站音乐播放器 —— 把B站视频当音乐听。纯客户端 Android 应用，无需后端。

            ### 功能

            - 扫码登录B站账号
            - 关键词搜索B站视频（WBI 签名）
            - DASH 音频流式播放，后台播放、通知栏控制
            - 三档循环模式（顺序 / 列表循环 / 单曲循环）
            - 播放队列管理（BottomSheet 弹窗，点击跳转、删除）
            - 收藏与播放历史
            - B站收藏夹浏览（登录后）
            - 沉浸式播放页 + 迷你播放条快捷操作
            - Spotify 风格深色 UI

            ### 安装

            下载下方 APK 直接安装。仅支持 **arm64** 设备，Android 8.0+。
