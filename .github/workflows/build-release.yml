name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install SDK platform android-36.1
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APKs
        run: |
          for f in app/build/outputs/apk/debug/*.apk; do
            base=$(basename "$f" .apk)
            cp "$f" "BiliMusic-${{ github.ref_name }}-${base#app-}.apk"
          done

      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete ${{ github.ref_name }} --yes || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BiliMusic-${{ github.ref_name }}-*.apk
          body: |
            ## BiliMusic ${{ github.ref_name }}

            B站音乐播放器 —— 把B站视频当音乐听。纯客户端 Android 应用，无需后端。

            ### 功能

            - 扫码登录B站账号
            - 关键词搜索B站视频（WBI 签名）
            - 搜索首页：热门搜索词 + 音乐排行榜 + 最近播放
            - DASH 音频流式播放，后台播放、通知栏控制
            - 三档循环模式（顺序 / 列表循环 / 单曲循环）
            - 播放队列管理（BottomSheet 弹窗，点击跳转、删除）
            - 收藏与播放历史
            - B站收藏夹浏览（登录后）
            - 沉浸式播放页 + 迷你播放条快捷操作
            - 我的页：快捷入口、GitHub 仓库、关于
            - Spotify 风格深色 UI

            ### 安装

            下载对应架构的 APK 直接安装：

            - **arm64-v8a**：64 位 ARM 设备（大多数现代手机）
            - **armeabi-v7a**：32 位 ARM 设备（旧设备）

            Android 8.0+。
